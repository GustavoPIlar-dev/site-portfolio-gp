<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#ff0844" />
    </linearGradient>
  </defs>
  <!-- Background escuro baseado no tema -->
  <rect width="100" height="100" rx="24" fill="#0B0F19" />
  
  <!-- Borda com gradiente neon -->
  <rect x="8" y="8" width="84" height="84" rx="18" fill="none" stroke="url(#neonGradient)" stroke-width="6" />
  
  <!-- Iniciais GP -->
  <text x="50" y="66" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="900" fill="url(#neonGradient)" text-anchor="middle" letter-spacing="-2">GP</text>
</svg>
